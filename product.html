<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fabric Detail - Milora Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/data.js"></script>
</head>
<body>

  <!-- Navigation -->
  <nav class="nav">
    <a href="index.html" class="nav-brand">
      <img src="images/logo.png" alt="Milora Home" class="nav-logo">
    </a>
    <div class="nav-links">
      <a href="products.html" class="active">Collection</a>
      <a href="about.html">About</a>
      <a href="fairs.html">Trade Shows</a>
      <a href="contact.html">Contact</a>
    </div>
  </nav>

  <div class="nav-space"></div>

  <div class="container fade-up" id="detail-container">
    <!-- Generated by JS -->
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    const container = document.getElementById("detail-container");
    const f = window.FABRICS ? window.FABRICS.find(x => x.id === id) : null;

    if (f) {
      document.title = `${f.name} - Milora Home`;
      
      const specs = [
        { k: "Composition", v: f.composition },
        { k: "Weight", v: f.weight },
        { k: "Width", v: f.width },
        { k: "Martindale", v: f.martindale },
        { k: "Minimum Order", v: f.minOrder },
        { k: "Lead Time", v: f.leadTime }
      ].filter(x => x.v); // Only show defined specs

      const specRows = specs.map(s => `
        <div class="spec-row">
          <span class="spec-k">${s.k}</span>
          <span class="spec-v">${s.v}</span>
        </div>
      `).join("");

      container.innerHTML = `
        <a class="back" href="products.html" style="display:inline-block; margin: 32px 0 0 0; color:var(--muted);">← Back to Collection</a>
        <div class="detail-layout">
          <div>
            <img src="${f.image}" alt="${f.name}" class="detail-img">
          </div>
          <div class="detail-info">
            <h1>${f.name}</h1>
            <p style="color:var(--muted); font-size:14px; margin-bottom:8px;">REF: ${f.code}</p>
            <span class="coll">Collection: ${f.collection}</span>
            
            <div class="specs">
              ${specRows}
            </div>

            <a class="btn-dark" href="contact.html?sample=${encodeURIComponent(f.id)}">Request a Sample</a>
            <p class="trade-note">We provide samples for free, however shipping costs are covered by the client.<br>Shipped worldwide from our facilities in Turkey. Trade inquiries welcome.</p>
          </div>
        </div>
      `;
    } else {
      container.innerHTML = `
        <div style="padding: 100px 0; text-align: center;">
          <h1>Fabric not found</h1>
          <p style="color:var(--muted); margin-bottom: 24px;">The fabric you are looking for does not exist or has been removed.</p>
          <a href="products.html" class="btn-primary" style="background:var(--fg); color:#fff;">Return to Collection</a>
        </div>
      `;
    }
  </script>

          <!-- Footer -->
  <footer class="footer">
    <div class="footer-content">
      <div class="footer-col" style="display: flex; align-items: center;">
        <img src="images/logo.png" alt="Milora Home" style="width: 100%; max-width: 220px; height: auto;">
      </div>
      <div class="footer-col">
        <h4>Navigation</h4>
        <a href="products.html">Collection</a>
        <a href="about.html">About Us</a>
        <a href="fairs.html">Trade Shows</a>
      </div>
      <div class="footer-col">
        <h4>Legal</h4>
        <a href="#">Privacy Policy</a>
        <a href="#">Cookie Policy</a>
        <a href="#">Terms of Service</a>
      </div>
    </div>
    <div class="footer-bottom">
      &copy; 2026 Milora Home Exclusive.
    </div>
  </footer>

</body>
</html>
