<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Trade Shows - Milora Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/data.js"></script>
</head>
<body>

  <!-- Navigation -->
  <nav class="nav">
    <a href="index.html" class="nav-brand">
      <img src="images/logo.png" alt="Milora Home" class="nav-logo">
    </a>
    <div class="nav-links">
      <a href="products.html">Collection</a>
      <a href="about.html">About</a>
      <a href="fairs.html" class="active">Trade Shows</a>
      <a href="contact.html">Contact</a>
    </div>
  </nav>

  <div class="nav-space"></div>

  <div class="container fade-up">
    <main class="content-page" id="fairs-container" style="max-width: 1200px; text-align: left;">
      <h1 style="text-align: left; margin-bottom: 48px;">Trade Shows</h1>
      
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 64px; align-items: start;">
        <!-- Left Side: Lists -->
        <div>
          <h4 style="font-size:14px; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted); margin-bottom:16px;">Upcoming Shows</h4>
          <ul class="contact-list" id="upcoming-list" style="margin-top:0; margin-bottom:64px;">
            <!-- Generated by JS -->
          </ul>

          <h4 style="font-size:14px; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted); margin-bottom:16px;">Previously Attended</h4>
          <ul class="contact-list" id="past-list" style="margin-top:0;">
            <!-- Generated by JS -->
          </ul>
        </div>

        <!-- Right Side: Image -->
        <div>
          <img src="images/evteks.png" alt="Evteks Trade Show" style="width: 100%; border: 1px solid var(--border); padding: 8px; background: #fff;">
        </div>
      </div>
    </main>
  </div>

  <script>
    if (window.SHOWS && window.PAST_SHOWS) {
      document.getElementById('upcoming-list').innerHTML = window.SHOWS.map(s => `
        <li>
          <span class="k">${s.dates}</span>
          <span class="v">${s.name}, ${s.city}<br><span style="font-size:12px; color:var(--muted);">${s.note || ""}</span></span>
        </li>
      `).join("");

      document.getElementById('past-list').innerHTML = window.PAST_SHOWS.map(p => `
        <li>
          <span class="k">${p.edition}</span>
          <span class="v">${p.name} · ${p.dates}</span>
        </li>
      `).join("");
    }
  </script>

          <!-- Footer -->
  <footer class="footer">
    <div class="footer-content">
      <div class="footer-col" style="display: flex; align-items: center;">
        <img src="images/logo.png" alt="Milora Home" style="width: 100%; max-width: 220px; height: auto;">
      </div>
      <div class="footer-col">
        <h4>Navigation</h4>
        <a href="products.html">Collection</a>
        <a href="about.html">About Us</a>
        <a href="fairs.html">Trade Shows</a>
      </div>
      <div class="footer-col">
        <h4>Legal</h4>
        <a href="#">Privacy Policy</a>
        <a href="#">Cookie Policy</a>
        <a href="#">Terms of Service</a>
      </div>
    </div>
    <div class="footer-bottom">
      &copy; 2026 Milora Home Exclusive.
    </div>
  </footer>

</body>
</html>
