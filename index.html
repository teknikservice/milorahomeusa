<html lang="en">
<head>
<!--
  MILORA HOME showroom site
  ─────────────────────────────────────────────────────────────
  HOW TO ADD A FABRIC:
  1. Scroll to the FABRICS array below (search for "ADD FABRICS HERE").
  2. Copy one fabric block { ... }, paste it, and edit the fields.
  3. Any spec you leave out simply won't be shown. Nothing looks empty.
  4. Save the file and re-upload it to your host (drag & drop on Netlify).

  IMPORTANT: fabric images live in the /images folder next to this file.
  All images should be JPG. Name them to match the image: field below.
  ─────────────────────────────────────────────────────────────
-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Milora Home | Upholstery &amp; Decorative Fabrics</title>
<meta name="description" content="Milora Home supplies premium upholstery and decorative fabrics for the trade. Wholesale rolls and cut yardage, shipped from Chicago.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2710%27 fill=%27%232FA0D8%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Archivo:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1EFEA;
  --ink:#191714;
  --muted:#6E6961;
  --line:#D8D3CA;
  --tick:#B9B3A7;
  --white:#FBFAF7;
  --display:'Marcellus',serif;
  --body:'Archivo',system-ui,sans-serif;
  --mono:'IBM Plex Mono',monospace;
  --pad:clamp(20px,4vw,56px);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;background:none;border:none;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* ── selvage: the woven edge of a fabric, where the mill prints its name.
      Used here as the site's signature device. ── */
.selvage{
  display:flex;align-items:center;gap:14px;
  padding:10px 0;
  border-top:1px solid var(--line);
  font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);
}
.selvage::before,.selvage::after{
  content:"";flex:1 0 12px;height:7px;
  background:repeating-linear-gradient(90deg,var(--tick) 0 1px,transparent 1px 6px);
}
.selvage::before{flex:0 0 34px}
.selvage .sv-name{color:var(--ink);font-family:var(--body);font-weight:500;letter-spacing:.18em;white-space:nowrap}
.selvage .sv-code{white-space:nowrap}

/* ── nav ── */
header{
  position:fixed;inset:0 0 auto 0;z-index:10;
  display:flex;flex-direction:column;align-items:center;
  padding:16px var(--pad) 12px;
  mix-blend-mode:normal;
}
header.solid{background:var(--paper);border-bottom:1px solid var(--line)}
.wordmark{display:block;line-height:0}
.wordmark img{height:46px;width:auto}
.wordmark .lg-white{display:none}
header.on-image .lg-black{display:none}
header.on-image .lg-white{display:block}
@media (max-width:640px){.wordmark img{height:36px}}
nav{display:flex;gap:clamp(22px,4vw,48px);margin-top:8px}
nav a{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);padding:4px 0;border-bottom:1px solid transparent}
nav a:hover,nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
header.on-image .wordmark, header.on-image nav a{color:var(--white)}
header.on-image nav a:hover, header.on-image nav a[aria-current="page"]{border-bottom-color:var(--white)}

main{min-height:100vh}

/* ── home ── */
.hero{position:relative;height:100svh;overflow:hidden;background:var(--ink)}
.hero img{width:100%;height:100%;object-fit:cover;opacity:.92}
@media (prefers-reduced-motion:no-preference){
  .hero img{animation:drift 26s ease-out forwards;transform-origin:60% 40%}
  @keyframes drift{from{transform:scale(1.07)}to{transform:scale(1)}}
  .hero-copy>*{opacity:0;transform:translateY(14px);animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
  .hero-copy>*:nth-child(2){animation-delay:.15s}
  .hero-copy>*:nth-child(3){animation-delay:.3s}
  @keyframes rise{to{opacity:1;transform:none}}
}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,13,10,.34),rgba(15,13,10,.06) 40%,rgba(15,13,10,.52))}
.hero-copy{position:absolute;z-index:2;left:var(--pad);right:var(--pad);bottom:clamp(56px,11vh,120px);color:var(--white)}
.hero-copy h1{font-family:var(--display);font-weight:400;font-size:clamp(38px,7.5vw,92px);line-height:1.04;letter-spacing:.015em;max-width:12ch}
.hero-copy p{margin-top:18px;font-size:clamp(14px,1.4vw,17px);max-width:44ch;color:rgba(251,250,247,.85)}
.hero-cta{display:inline-flex;align-items:center;gap:12px;margin-top:30px;font-family:var(--mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--white);border-bottom:1px solid rgba(251,250,247,.6);padding-bottom:6px}
.hero-cta:hover{border-bottom-color:var(--white)}
.hero-cta span{font-size:15px;transition:transform .25s}
.hero-cta:hover span{transform:translateX(5px)}
/* vertical selvage on hero edge */
.hero-selvage{
  position:absolute;z-index:2;top:0;bottom:0;right:clamp(12px,2.5vw,32px);
  display:flex;align-items:center;justify-content:center;
  writing-mode:vertical-rl;
  font-family:var(--mono);font-size:11px;letter-spacing:.38em;text-transform:uppercase;
  color:rgba(251,250,247,.88);
  text-shadow:0 1px 8px rgba(0,0,0,.4);
  border-left:1px solid rgba(251,250,247,.35);
  padding-left:12px;
}
@media (max-width:640px){.hero-selvage{display:none}}

/* ── shared page shell ── */
.page{padding:calc(72px + clamp(28px,6vh,64px)) var(--pad) 60px;max-width:1360px;margin:0 auto}
.page-head h2{font-family:var(--display);font-weight:400;font-size:clamp(30px,4.4vw,52px);letter-spacing:.01em}
.page-head p{color:var(--muted);max-width:56ch;margin-top:10px}

/* ── gallery ── */
.filters{display:flex;flex-wrap:wrap;gap:8px 26px;margin:34px 0 8px;border-bottom:1px solid var(--line);padding-bottom:14px}
.filters button{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding:4px 0;border-bottom:1px solid transparent}
.filters button:hover{color:var(--ink)}
.filters button.active{color:var(--ink);border-bottom-color:var(--ink)}
.count{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.12em;margin:14px 0 22px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(18px,2.6vw,36px)}
@media (max-width:960px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
.card{display:block}
.card .frame{aspect-ratio:6/5;overflow:hidden;background:#E4E1DA}
.card img{width:100%;height:100%;object-fit:cover;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
@media (prefers-reduced-motion:no-preference){.card:hover img{transform:scale(1.045)}}
.card .selvage{margin-top:0}
.card:hover .selvage{border-top-color:var(--ink)}
.empty{padding:60px 0;color:var(--muted);font-family:var(--mono);font-size:13px;letter-spacing:.08em}

/* ── fabric detail ── */
.back{display:inline-flex;gap:10px;font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:26px}
.back:hover{color:var(--ink)}
.detail{display:grid;grid-template-columns:minmax(0,7fr) minmax(300px,4fr);gap:clamp(28px,4.5vw,72px);align-items:start}
@media (max-width:880px){.detail{grid-template-columns:1fr}}
.detail .frame{background:#E4E1DA}
.detail .frame img{width:100%;height:auto}
.detail-info h2{font-family:var(--display);font-weight:400;font-size:clamp(28px,3.6vw,44px);line-height:1.1}
.detail-info .code{font-family:var(--mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.detail-info .coll{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin-top:26px;color:var(--muted)}
.specs{margin-top:10px;border-top:1px solid var(--line)}
.specs div{display:grid;grid-template-columns:130px 1fr;gap:16px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.specs dt{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.specs dd{font-weight:400}
.inquire{display:inline-block;margin-top:34px;padding:15px 34px;background:var(--ink);color:var(--white);font-family:var(--mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;transition:opacity .2s}
.inquire:hover{opacity:.82}
.trade-note{margin-top:16px;font-size:13px;color:var(--muted);max-width:36ch}

/* ── about / contact ── */
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,5vw,90px);margin-top:44px}
@media (max-width:820px){.about-grid{grid-template-columns:1fr}}
.about-grid h3{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:16px}
.about-grid p{margin-bottom:14px;max-width:52ch}
.contact-list{list-style:none}
.contact-list li{padding:13px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.contact-list .k{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.contact-list a:hover{border-bottom:1px solid var(--ink)}

/* ── footer ── */
footer{margin-top:40px;padding:0 var(--pad) 18px}
footer .inner{max-width:1360px;margin:0 auto}
footer .foot-line{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px 24px;border-top:1px solid var(--line);padding-top:14px}
footer .legal{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
</style>
</head>

function setNav(page, onImage){
  document.querySelectorAll("[data-nav]").forEach(a=>{
    if(a.dataset.nav===page) a.setAttribute("aria-current","page");
    else a.removeAttribute("aria-current");
  });
  hdr.classList.toggle("on-image", !!onImage);
  hdr.classList.toggle("solid", !onImage);
}

function selvageHTML(name, code){
  return `<div class="selvage"><span class="sv-name">${esc(name)}</span><span class="sv-code">${esc(code)}</span></div>`;
}

/* ── router ── */
let currentHash = "#/";
function route(hash){
  const h = hash || location.hash || "#/";
  currentHash = h;
  const m = h.match(/^#\/fabric\/(.+)$/);
  if(m) fabric(decodeURIComponent(m[1]));
  else if(h==="#/gallery") gallery();
  else if(h==="#/about") about();
  else home();
  window.scrollTo({top:0});
  app.focus({preventScroll:true});
}
/* Handle internal links in script: some embedded viewers block normal
   link navigation, so we never rely on the browser's default behavior. */
document.addEventListener("click", e=>{
  const a = e.target.closest('a[href^="#"]');
  if(!a) return;
  e.preventDefault();
  const h = a.getAttribute("href");
  try { if(location.hash !== h) location.hash = h; } catch(_) {}
  route(h);
});
window.addEventListener("hashchange", ()=>{ if(location.hash !== currentHash) route(); });
route();
</script>
