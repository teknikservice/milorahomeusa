<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--paper:#F1EFEA;--ink:#191714;--muted:#6E6961;--line:#D8D3CA;--white:#FBFAF7}

body{background:var(--ink);color:var(--white);font-family:'Archivo',system-ui,sans-serif;min-height:100svh;overflow:hidden}

/* woven thread background */
.threads{position:fixed;inset:0;z-index:0;opacity:.07}
.threads::before,.threads::after{content:"";position:absolute;inset:0}
.threads::before{
  background:repeating-linear-gradient(90deg,var(--white) 0 1px,transparent 1px 28px);
  animation:weave-h 40s linear infinite;
}
.threads::after{
  background:repeating-linear-gradient(0deg,var(--white) 0 1px,transparent 1px 28px);
  animation:weave-v 50s linear infinite;
}
@keyframes weave-h{from{transform:translateX(0)}to{transform:translateX(28px)}}
@keyframes weave-v{from{transform:translateY(0)}to{transform:translateY(28px)}}

/* gradient overlay */
.glow{position:fixed;inset:0;z-index:1;
  background:radial-gradient(ellipse 80% 60% at 50% 45%,rgba(47,160,216,.06),transparent 70%),
             radial-gradient(ellipse 50% 40% at 30% 70%,rgba(185,179,167,.04),transparent)}

/* content */
.scene{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100svh;padding:40px 24px;text-align:center}

.logo{height:56px;width:auto;margin-bottom:48px;opacity:0;animation:fade-down .8s cubic-bezier(.2,.7,.2,1) .2s forwards}
@media(max-width:640px){.logo{height:42px;margin-bottom:36px}}

.divider{display:flex;align-items:center;gap:16px;margin-bottom:42px;opacity:0;animation:fade-down .8s cubic-bezier(.2,.7,.2,1) .4s forwards}
.divider span{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.4em;text-transform:uppercase;color:rgba(251,250,247,.4)}
.divider::before,.divider::after{content:"";width:clamp(30px,8vw,80px);height:1px;background:linear-gradient(90deg,transparent,rgba(251,250,247,.25))}
.divider::after{background:linear-gradient(90deg,rgba(251,250,247,.25),transparent)}

h1{font-family:'Marcellus',serif;font-weight:400;font-size:clamp(32px,5.5vw,64px);line-height:1.12;letter-spacing:.02em;max-width:14ch;opacity:0;animation:fade-up 1s cubic-bezier(.2,.7,.2,1) .6s forwards}

.sub{margin-top:20px;font-weight:300;font-size:clamp(14px,1.4vw,17px);color:rgba(251,250,247,.6);max-width:42ch;line-height:1.7;opacity:0;animation:fade-up .8s cubic-bezier(.2,.7,.2,1) .85s forwards}

.contact-btn{display:inline-flex;align-items:center;gap:10px;margin-top:40px;padding:16px 36px;border:1px solid rgba(251,250,247,.2);color:var(--white);font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;transition:all .35s ease;opacity:0;animation:fade-up .8s cubic-bezier(.2,.7,.2,1) 1.05s forwards}
.contact-btn:hover{background:var(--white);color:var(--ink);border-color:var(--white)}
.contact-btn span{transition:transform .25s}.contact-btn:hover span{transform:translateX(4px)}

/* bottom selvage */
.selvage{position:fixed;bottom:0;left:0;right:0;z-index:3;
  display:flex;align-items:center;justify-content:center;gap:16px;
  padding:16px 24px;
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.3em;text-transform:uppercase;
  color:rgba(251,250,247,.3)}
.selvage::before,.selvage::after{content:"";flex:1;max-width:120px;height:6px;
  background:repeating-linear-gradient(90deg,rgba(251,250,247,.15) 0 1px,transparent 1px 6px)}

/* floating dot */
.dot{position:fixed;z-index:2;width:8px;height:8px;border-radius:50%;background:#2FA0D8;
  top:20%;right:15%;opacity:0;animation:pulse 4s ease-in-out 1.5s infinite}
.dot:nth-child(2){top:70%;right:80%;animation-delay:2.5s;width:6px;height:6px;opacity:0}
@keyframes pulse{0%,100%{opacity:0;transform:scale(.8)}50%{opacity:.4;transform:scale(1)}}

@keyframes fade-down{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
@keyframes fade-up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
</style>
</head>
